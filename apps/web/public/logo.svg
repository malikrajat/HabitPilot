<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="HabitPilot">
  <title>HabitPilot</title>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111f33" />
      <stop offset="0.55" stop-color="#0b1424" />
      <stop offset="1" stop-color="#060b13" />
    </linearGradient>
    <radialGradient id="aurora" cx="0.72" cy="0.2" r="0.72">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.22" />
      <stop offset="0.55" stop-color="#4ade80" stop-opacity="0.05" />
      <stop offset="1" stop-color="#4ade80" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="wingTop" x1="0.15" y1="0.1" x2="0.85" y2="0.9">
      <stop offset="0" stop-color="#a7f3c9" />
      <stop offset="0.45" stop-color="#4ade80" />
      <stop offset="1" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="wingBottom" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#22c55e" />
      <stop offset="1" stop-color="#0f6b3a" />
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.25" />
      <stop offset="1" stop-color="#4ade80" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#background)" />
  <rect width="1024" height="1024" rx="228" fill="url(#aurora)" />
  <rect x="26" y="26" width="972" height="972" rx="206" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="4" />

  <!-- Habit trail with checkpoints -->
  <path
    d="M 196 824 C 252 800 292 762 338 738 C 392 710 430 690 470 668 C 496 654 514 646 538 638"
    fill="none"
    stroke="url(#trail)"
    stroke-width="26"
    stroke-linecap="round"
  />
  <circle cx="196" cy="824" r="25" fill="#0b1424" stroke="#4ade80" stroke-width="15" />
  <circle cx="338" cy="738" r="25" fill="#0b1424" stroke="#4ade80" stroke-width="15" />
  <circle cx="470" cy="668" r="27" fill="#fbbf24" />

  <!-- Paper plane / compass mark -->
  <g>
    <path d="M 838 232 L 252 556 L 492 640 Z" fill="url(#wingTop)" />
    <path d="M 838 232 L 492 640 L 392 840 Z" fill="url(#wingBottom)" />
    <path
      d="M 838 232 L 492 640"
      stroke="#052e16"
      stroke-opacity="0.35"
      stroke-width="12"
      stroke-linecap="round"
    />
    <path
      d="M 252 556 L 492 640 L 392 840"
      fill="none"
      stroke="#d1fae5"
      stroke-opacity="0.12"
      stroke-width="5"
      stroke-linejoin="round"
    />
  </g>
</svg>
